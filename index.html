<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EDE2; --card:#FCFAF5; --ink:#1A3636; --muted:#677D6A;
    --accent:#677D6A; --accent2:#B4654A; --lime:#B9F36B; --purple:#8B7BD8; --accent-ink:#fff;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .wrap{height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;padding:clamp(16px,2vh,28px) clamp(20px,2vw,34px)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:auto;grid-auto-flow:dense;gap:clamp(10px,1.2vw,18px);flex:1;min-height:0;align-content:start}
  .card{background:var(--card);border-radius:26px;padding:clamp(14px,1.6vh,22px) clamp(16px,1.6vw,24px);overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .card h2{font-size:clamp(11px,1vw,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:800;flex-shrink:0}
  .big{font-family:Fraunces,serif;font-size:clamp(34px,4vw,52px);line-height:1.02}
  .med{font-size:clamp(18px,1.9vw,26px);font-weight:800;line-height:1.15}
  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.07)}
  .row:last-child{border-bottom:0}
  .row .t{font-weight:700;font-size:clamp(14px,1.25vw,19px)}
  .row .s{color:var(--muted);font-size:clamp(12px,1.1vw,16px);text-align:right}
  .hero{grid-column:span 2;grid-row:span 2;background:var(--accent);color:var(--accent-ink);justify-content:center}
  .hero h2{color:var(--accent-ink);opacity:.75}
  .hero .big{font-size:clamp(44px,5.5vw,76px)}
  .hero .sub{font-size:24px;margin-top:8px;opacity:.92}
  .wide{grid-column:span 2}
  .accent{background:var(--accent2);color:#fff}
  .accent h2{color:rgba(255,255,255,.8)}
  .lime{background:var(--lime);color:#1C4A1E}
  .lime h2{color:#3d6b35}
  .purple{background:var(--purple);color:#23233A}
  .purple h2{color:#23233A;opacity:.7}
  .foot{margin-top:16px;font-size:14px;color:var(--muted);flex-shrink:0}
  .photo{width:100%;height:300px;object-fit:cover;border-radius:18px;display:block}
  .photo.tall{height:460px}
  .wx-art{width:100%;height:110px;display:block}
  .wx-art.sm{height:80px}
  .bar{height:10px;border-radius:99px;background:rgba(0,0,0,.14);overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .with-ico{display:inline-flex;align-items:center;gap:8px}
  .with-ico svg{width:20px;height:20px;flex-shrink:0;color:var(--muted)}
  #seasonalCard{padding:0;overflow:hidden}
  #seasonalCard img{border-radius:0}
  #lockBtn{position:fixed;right:16px;bottom:14px;opacity:.45;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
  /* gate */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10}
  #gate .box{text-align:center}
  #gate h1{font-size:56px;margin-bottom:8px}
  #gate p{color:var(--muted);font-size:20px;margin:0 0 26px}
  #code{font-size:44px;letter-spacing:.35em;text-align:center;width:280px;padding:14px 10px;border:2px solid var(--accent);border-radius:16px;background:var(--card);color:var(--ink);outline:none}
  #gate button{display:block;margin:22px auto 0;font-size:20px;font-weight:800;padding:14px 44px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
  #gateErr{color:var(--accent2);font-size:17px;min-height:24px;margin-top:14px;font-weight:700}
  #status{position:fixed;left:16px;bottom:14px;font-size:13px;color:var(--muted);opacity:.7}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h1>Family Dashboard</h1>
    <p>Enter the passcode to open the board.</p>
    <input id="code" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <button id="unlockBtn">Open</button>
    <div id="gateErr"></div>
  </div>
</div>

<div class="wrap" id="board" style="display:none">
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>
<button id="lockBtn" style="display:none">Lock</button>
<div id="status"></div>

<script>
/* Data source: a published Google Sheet cell holding the encrypted blob.
   DATA_URL is filled in at deploy time. The blob is JSON:
   {"v":1,"iv":"base64","data":"base64"}  (AES-GCM, key = PBKDF2(passcode)). */
const DATA_URL = "https://docs.google.com/spreadsheets/d/180HDtvZf5ZbFb4PTiP_veXwaqcoRk6WNHg0e36pM2sM/export?format=csv";
const GVIZ_URL = "https://docs.google.com/spreadsheets/d/180HDtvZf5ZbFb4PTiP_veXwaqcoRk6WNHg0e36pM2sM/gviz/tq?tqx=out:json&sheet=Sheet1";
const SALT_HEX = "46a7d3c19e824b5f8c03a61d2f9e47b0";
const MONTH_PALETTES = [
  {bg:"#EAF1F5",card:"#FFFFFF",ink:"#1E2A33",muted:"#5A6D7A",accent:"#4A7FA5",accent2:"#B8C9D4",accentInk:"#fff"},
  {bg:"#F7ECEE",card:"#FFFBFC",ink:"#33202A",muted:"#8A5A6A",accent:"#B65A7A",accent2:"#E3B7C2",accentInk:"#fff"},
  {bg:"#EDF3E6",card:"#FCFDF8",ink:"#22331C",muted:"#5F7A52",accent:"#7BA75E",accent2:"#C9D9A8",accentInk:"#23233A"},
  {bg:"#F2EFE6",card:"#FFFDF8",ink:"#2A2A22",muted:"#7A7A5E",accent:"#9DBE7A",accent2:"#F2C94C",accentInk:"#23233A"},
  {bg:"#F7ECEC",card:"#FFFBFB",ink:"#33202A",muted:"#8A5A6A",accent:"#E08FA9",accent2:"#F2C4D0",accentInk:"#33202A"},
  {bg:"#FDF6DD",card:"#FFFEF5",ink:"#332A10",muted:"#8A7A44",accent:"#E8C547",accent2:"#F2E2A0",accentInk:"#332A10"},
  {bg:"#FDF0DD",card:"#FFFBF2",ink:"#33200F",muted:"#8A5E33",accent:"#E8873D",accent2:"#F2C09A",accentInk:"#33200F"},
  {bg:"#FDF3DC",card:"#FFFBF2",ink:"#332A10",muted:"#8A6E33",accent:"#D9A441",accent2:"#F0D49A",accentInk:"#332A10"},
  {bg:"#F7ECDC",card:"#FFFBF2",ink:"#33200F",muted:"#8A5E33",accent:"#B4662A",accent2:"#D9A06A",accentInk:"#fff"},
  {bg:"#F7EEDD",card:"#FFFBF2",ink:"#3B2314",muted:"#8A5A33",accent:"#C2571B",accent2:"#E0A06A",accentInk:"#fff"},
  {bg:"#F3EAD9",card:"#FBF6EC",ink:"#2E1E10",muted:"#7A5A33",accent:"#7A4A21",accent2:"#C9A06A",accentInk:"#fff"},
  {bg:"#EAF0EB",card:"#F7FAF7",ink:"#1E2A22",muted:"#5A6D5E",accent:"#2F5D50",accent2:"#9AB8AC",accentInk:"#fff"},
];
const $ = s => document.querySelector(s);
function hexToBytes(h){const b=new Uint8Array(h.length/2);for(let i=0;i<b.length;i++)b[i]=parseInt(h.substr(i*2,2),16);return b;}
function b64ToBytes(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function deriveKey(code){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:hexToBytes(SALT_HEX), iterations:100000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
function dequoteCsv(t){
  t = t.trim();
  if(t.length >= 2 && t[0] === '"' && t[t.length-1] === '"') t = t.slice(1,-1).replace(/""/g,'"');
  return t.trim();
}
async function fetchBlobText(){
  try{
    const res = await fetch(DATA_URL, {cache:"no-store"});
    if(res.ok) return dequoteCsv(await res.text());
  }catch(e){}
  const res = await fetch(GVIZ_URL, {cache:"no-store"});
  if(!res.ok) throw new Error("data fetch failed");
  const txt = await res.text();
  const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
  const v = json.table.rows[0].c[0].v;
  if(!v) throw new Error("data fetch failed");
  return v;
}
async function loadBoard(code){
  const key = await deriveKey(code);
  let blobText;
  try{
    blobText = await fetchBlobText();
  }catch(e){
    const err = new Error("fetch failed"); err.kind = "fetch"; throw err;
  }
  const blob = JSON.parse(blobText);
  let plain;
  try{
    plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(blob.iv)}, key, b64ToBytes(blob.data));
  }catch(e){
    const err = new Error("decrypt failed"); err.kind = "decrypt"; throw err;
  }
  return JSON.parse(new TextDecoder().decode(plain));
}
function card(title, inner, cls){
  return `<div class="card ${cls||""}"><h2>${esc(title)}</h2>${inner}</div>`;
}
function rows(items){
  return items.map(it=>`<div class="row"><span class="t">${esc(it.title)}</span><span class="s">${esc(it.sub||"")}</span></div>`).join("");
}
async function loadSeasonal(){
  const el = document.getElementById("seasonalCard");
  const img = document.getElementById("seasonalImg");
  if(!el || !img) return;
  try{
    const res = await fetch("seasonal/manifest.json", {cache:"no-store"});
    if(!res.ok) throw new Error("no manifest");
    const m = await res.json();
    const now = new Date();
    const key = now.toLocaleString("en-US", {month:"long"}).toLowerCase();
    const list = m[key] || [];
    if(!list.length) throw new Error("empty");
    img.src = list[now.getDate() % list.length];
  }catch(e){ el.style.display = "none"; }
}
function wxArt(cond, small){
  const c = (cond||"").toLowerCase();
  const sun = '<circle cx="52" cy="48" r="26" fill="#E8A33D"/><g stroke="#E8A33D" stroke-width="5" stroke-linecap="round"><line x1="52" y1="6" x2="52" y2="16"/><line x1="52" y1="80" x2="52" y2="90"/><line x1="10" y1="48" x2="20" y2="48"/><line x1="84" y1="48" x2="94" y2="48"/><line x1="22" y1="18" x2="29" y2="25"/><line x1="75" y1="71" x2="82" y2="78"/><line x1="82" y1="18" x2="75" y2="25"/><line x1="29" y1="71" x2="22" y2="78"/></g>';
  const cloud = '<g fill="#ffffff" stroke="#E5DDD0" stroke-width="2"><ellipse cx="62" cy="66" rx="30" ry="18"/><ellipse cx="86" cy="58" rx="24" ry="16"/><ellipse cx="42" cy="58" rx="18" ry="12"/></g>';
  const rain = '<g stroke="#7FB3D5" stroke-width="4" stroke-linecap="round"><line x1="52" y1="88" x2="48" y2="100"/><line x1="70" y1="88" x2="66" y2="100"/><line x1="88" y1="88" x2="84" y2="100"/></g>';
  const snow = '<g fill="#BFD9E8"><circle cx="50" cy="92" r="4"/><circle cx="68" cy="92" r="4"/><circle cx="86" cy="92" r="4"/></g>';
  let inner = sun + cloud;
  if(c.includes("rain")||c.includes("shower")||c.includes("storm")) inner = cloud + rain;
  else if(c.includes("snow")) inner = cloud + snow;
  else if(c.includes("clear")||c.includes("sun")) inner = sun;
  return `<svg class="wx-art${small ? " sm" : ""}" viewBox="0 0 104 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(cond||"")}">${inner}</svg>`;
}
function sunArc(){
  return `<svg class="wx-art" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><path d="M10 90 A 90 90 0 0 1 190 90" fill="none" stroke="#E8A33D" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/><line x1="4" y1="90" x2="196" y2="90" stroke="#C9BBA6" stroke-width="2"/><circle cx="100" cy="14" r="13" fill="#E8A33D"/></svg>`;
}
function moneyNum(s){ const n = parseFloat(String(s||"").replace(/[^0-9.]/g,"")); return isNaN(n) ? null : n; }
function budgetBar(b){
  const left = moneyNum(b.left), of = moneyNum(b.of);
  if(left === null || of === null || of <= 0) return "";
  const pct = Math.max(0, Math.min(100, Math.round((1 - left / of) * 100)));
  return `<div class="bar"><i style="width:${pct}%"></i></div><div style="color:var(--muted);margin-top:8px">${pct}% spent</div>`;
}
const ICO = {
  steps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="7" r="2.5"/><path d="M9.5 15 L14.5 9"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 13A8 8 0 1 1 11 4a6.5 6.5 0 0 0 9 9z"/></svg>',
  weight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3"/><path d="M6 8h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 8z"/><path d="M9 13h6"/></svg>'
};
function render(d){
  // monthly seasonal palette
  const now = new Date();
  const p = MONTH_PALETTES[now.getMonth()];
  const r = document.documentElement.style;
  r.setProperty("--bg",p.bg); r.setProperty("--card",p.card); r.setProperty("--ink",p.ink);
  r.setProperty("--muted",p.muted); r.setProperty("--accent",p.accent); r.setProperty("--accent2",p.accent2);
  r.setProperty("--accent-ink",p.accentInk);

  let html = '<div class="card wide" id="seasonalCard"><img id="seasonalImg" class="photo" src="" alt="" onerror="this.closest(\'.card\').style.display=\'none\'"></div>';
  html += `<div class="card"><h2>${esc(d.today && d.today.label ? d.today.label : "Today")}</h2><div class="big"><span id="clockTime"></span></div><div class="med" id="clockDate"></div></div>`;
  {
    let heroTitle = null, heroSub = "", heroLabel = "Up next";
    if(d.today && d.today.nextEvent){ heroTitle = d.today.nextEvent.title; heroSub = d.today.nextEvent.sub||""; }
    else if(d.tomorrow && d.tomorrow.length){ heroTitle = d.tomorrow[0].title; heroSub = d.tomorrow[0].sub||""; heroLabel = "Tomorrow"; }
    else { heroTitle = d.today && d.today.label ? d.today.label : "Today"; heroSub = "Nothing on the calendar"; heroLabel = "Today"; }
    html += `<div class="card hero"><h2>${esc(heroLabel)}</h2><div class="big">${esc(heroTitle)}</div>${heroSub ? `<div class="sub">${esc(heroSub)}</div>` : ""}</div>`;
  }
  if(d.photo){
    html += card("Family", `<img class="photo tall" src="${esc(d.photo)}" alt="Family photo" onerror="this.closest('.card').style.display='none'">`);
  }
  if(d.schedule && d.schedule.length){
    html += card("Today's schedule", rows(d.schedule), "wide");
  }
  if(d.tomorrow && d.tomorrow.length){
    html += card("Tomorrow", rows(d.tomorrow));
  }
  if(d.weather && d.weather.today){
    const w = d.weather.today;
    html += card("Weather today", `${wxArt(w.cond)}<div class="big">${esc(w.high)}° / ${esc(w.low)}°</div><div class="med">${esc(w.cond||"")}</div><div class="s" style="color:var(--muted);margin-top:6px">Rain ${esc(w.rain||"—")}</div>`);
  }
  if(d.weather && d.weather.weekend){
    const w = d.weather.weekend;
    html += card("Weekend weather", `${wxArt(w.cond, true)}<div class="med">${esc(w.label||"Weekend")}</div><div class="big">${esc(w.high)}° / ${esc(w.low)}°</div><div style="color:var(--muted)">Rain ${esc(w.rain||"—")}</div>`);
  }
  if(d.sunset){
    html += card("Sunset", `${sunArc()}<div class="big">${esc(d.sunset)}</div>`);
  }
  if(d.dinner){
    html += card("Tonight's dinner", `<div class="med">${esc(d.dinner)}</div>`, "lime");
  }
  if(d.meals && d.meals.length){
    html += card("This week's meals", rows(d.meals));
  }
  if(d.shopping){
    const top = (d.shopping.top||[]).map(t=>`<div class="row"><span class="t">${esc(t)}</span></div>`).join("");
    html += card("Shopping list", `<div class="big">${esc(d.shopping.count)} items</div>${top}`);
  }
  if(d.low && d.low.length){
    html += card("Running low", d.low.map(t=>`<div class="row"><span class="t">${esc(t)}</span></div>`).join(""), "accent");
  }
  if(d.deals && d.deals.length){
    html += card("Deals this week", rows(d.deals));
  }
  if(d.countdowns && d.countdowns.length){
    html += card("Counting down", d.countdowns.map(c=>`<div class="row"><span class="t">${esc(c.label)}</span><span class="s">${esc(c.days)} days</span></div>`).join(""), "purple");
  }
  if(d.health){
    let inner = "";
    if(d.health.steps) inner += `<div class="row"><span class="t with-ico">${ICO.steps}Steps</span><span class="s">${esc(d.health.steps)}</span></div>`;
    if(d.health.sleep) inner += `<div class="row"><span class="t with-ico">${ICO.moon}Sleep</span><span class="s">${esc(d.health.sleep)}</span></div>`;
    if(d.health.weight) inner += `<div class="row"><span class="t with-ico">${ICO.weight}Weight</span><span class="s">${esc(d.health.weight)}</span></div>`;
    if(inner) html += card("Health", inner);
  }
  if(d.budget){
    html += card("Budget", `<div class="big">${esc(d.budget.left)} left</div><div style="color:var(--muted)">of ${esc(d.budget.of)} this month</div>${budgetBar(d.budget)}`, "lime");
  }
  if(d.plan){
    html += card("Tonight's plan", `<div class="med">${esc(d.plan)}</div>`, "purple");
  }
  $("#grid").innerHTML = html || card("Board", `<div class="med">No data yet — check back after the next refresh.</div>`);
  if(d.generatedAt){
    const g = new Date(d.generatedAt);
    $("#foot").textContent = "Updated " + g.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  }
  loadSeasonal();
  tickClock();
}
function tickClock(){
  const n = new Date();
  $("#clockTime").textContent = n.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  $("#clockDate").textContent = n.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
}
async function unlock(code){
  $("#gateErr").textContent = "";
  $("#status").textContent = "Opening…";
  try{
    const d = await loadBoard(code);
    localStorage.setItem("famdash_code", code);
    $("#gate").style.display = "none";
    $("#board").style.display = "flex";
    $("#lockBtn").style.display = "block";
    render(d);
    $("#status").textContent = "";
    clearInterval(window._refetch);
    window._refetch = setInterval(async ()=>{
      try{ render(await loadBoard(localStorage.getItem("famdash_code"))); }catch(e){}
    }, 60*60*1000);
  }catch(e){
    $("#gateErr").textContent = e && e.kind === "fetch"
      ? "Couldn't reach the data — check the connection and try again."
      : "That passcode didn't work. Try again.";
    $("#status").textContent = "";
    localStorage.removeItem("famdash_code");
  }
}
$("#unlockBtn").addEventListener("click", ()=>{ const c = $("#code").value.trim(); if(c) unlock(c); });
$("#code").addEventListener("keydown", e=>{ if(e.key === "Enter"){ const c = $("#code").value.trim(); if(c) unlock(c); } });
$("#lockBtn").addEventListener("click", ()=>{
  localStorage.removeItem("famdash_code");
  $("#board").style.display = "none"; $("#lockBtn").style.display = "none";
  $("#gate").style.display = "flex"; $("#code").value = ""; $("#code").focus();
});
tickClock(); setInterval(tickClock, 30000);
const saved = localStorage.getItem("famdash_code");
if(saved){ $("#code").value = saved; unlock(saved); } else { $("#code").focus(); }
</script>
</body>
</html>
