<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EDE2; --card:#FCFAF5; --ink:#1A3636; --muted:#677D6A;
    --accent:#677D6A; --accent2:#B4654A; --lime:#B9F36B; --purple:#8B7BD8;
  }
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1780px;margin:0 auto;padding:28px 34px 40px}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
  h1{font-family:Fraunces,serif;font-size:46px;margin:0;line-height:1.05}
  .clock{font-size:22px;font-weight:700;text-align:right}
  .clock small{display:block;font-size:15px;color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(150px,auto);gap:18px}
  .card{background:var(--card);border-radius:26px;padding:22px 24px;overflow:hidden}
  .card h2{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:800}
  .big{font-family:Fraunces,serif;font-size:52px;line-height:1.02}
  .med{font-size:26px;font-weight:800;line-height:1.15}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.07)}
  .row:last-child{border-bottom:0}
  .row .t{font-weight:700;font-size:19px}
  .row .s{color:var(--muted);font-size:16px;text-align:right}
  .hero{grid-column:span 2;grid-row:span 2;background:var(--accent);color:#fff}
  .hero h2{color:rgba(255,255,255,.75)}
  .hero .big{font-size:76px}
  .hero .sub{font-size:24px;margin-top:8px;opacity:.92}
  .wide{grid-column:span 2}
  .accent{background:var(--accent2);color:#fff}
  .accent h2{color:rgba(255,255,255,.8)}
  .lime{background:var(--lime);color:#1C4A1E}
  .lime h2{color:#3d6b35}
  .purple{background:var(--purple);color:#fff}
  .purple h2{color:rgba(255,255,255,.8)}
  .foot{margin-top:20px;font-size:14px;color:var(--muted)}
  #lockBtn{position:fixed;right:16px;bottom:14px;opacity:.45;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
  /* gate */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10}
  #gate .box{text-align:center}
  #gate h1{font-size:56px;margin-bottom:8px}
  #gate p{color:var(--muted);font-size:20px;margin:0 0 26px}
  #code{font-size:44px;letter-spacing:.35em;text-align:center;width:280px;padding:14px 10px;border:2px solid var(--accent);border-radius:16px;background:var(--card);color:var(--ink);outline:none}
  #gate button{display:block;margin:22px auto 0;font-size:20px;font-weight:800;padding:14px 44px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
  #gateErr{color:var(--accent2);font-size:17px;min-height:24px;margin-top:14px;font-weight:700}
  #status{position:fixed;left:16px;bottom:14px;font-size:13px;color:var(--muted);opacity:.7}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h1>Family Dashboard</h1>
    <p>Enter the passcode to open the board.</p>
    <input id="code" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <button id="unlockBtn">Open</button>
    <div id="gateErr"></div>
  </div>
</div>

<div class="wrap" id="board" style="display:none">
  <header>
    <h1 id="titleDay">Today</h1>
    <div class="clock"><span id="clockTime"></span><small id="clockDate"></small></div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>
<button id="lockBtn" style="display:none">Lock</button>
<div id="status"></div>

<script>
/* Data source: a published Google Sheet cell holding the encrypted blob.
   DATA_URL is filled in at deploy time. The blob is JSON:
   {"v":1,"iv":"base64","data":"base64"}  (AES-GCM, key = PBKDF2(passcode)). */
const DATA_URL = "https://docs.google.com/spreadsheets/d/180HDtvZf5ZbFb4PTiP_veXwaqcoRk6WNHg0e36pM2sM/export?format=csv";
const GVIZ_URL = "https://docs.google.com/spreadsheets/d/180HDtvZf5ZbFb4PTiP_veXwaqcoRk6WNHg0e36pM2sM/gviz/tq?tqx=out:json&sheet=Sheet1";
const SALT_HEX = "46a7d3c19e824b5f8c03a61d2f9e47b0";
const PALETTES = [
  {bg:"#F3EDE2",card:"#FCFAF5",ink:"#1A3636",muted:"#677D6A",accent:"#677D6A",accent2:"#B4654A"},
  {bg:"#141414",card:"#1F1F1F",ink:"#F2F0FA",muted:"#9a93ad",accent:"#8B7BD8",accent2:"#B9F36B"},
  {bg:"#F2F0FA",card:"#FFFFFF",ink:"#23233A",muted:"#6d6a8a",accent:"#8B7BD8",accent2:"#B9F36B"},
];
const $ = s => document.querySelector(s);
function hexToBytes(h){const b=new Uint8Array(h.length/2);for(let i=0;i<b.length;i++)b[i]=parseInt(h.substr(i*2,2),16);return b;}
function b64ToBytes(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function deriveKey(code){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:hexToBytes(SALT_HEX), iterations:100000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
function dequoteCsv(t){
  t = t.trim();
  if(t.length >= 2 && t[0] === '"' && t[t.length-1] === '"') t = t.slice(1,-1).replace(/""/g,'"');
  return t.trim();
}
async function fetchBlobText(){
  try{
    const res = await fetch(DATA_URL, {cache:"no-store"});
    if(res.ok) return dequoteCsv(await res.text());
  }catch(e){}
  const res = await fetch(GVIZ_URL, {cache:"no-store"});
  if(!res.ok) throw new Error("data fetch failed");
  const txt = await res.text();
  const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
  const v = json.table.rows[0].c[0].v;
  if(!v) throw new Error("data fetch failed");
  return v;
}
async function loadBoard(code){
  const key = await deriveKey(code);
  let blobText;
  try{
    blobText = await fetchBlobText();
  }catch(e){
    const err = new Error("fetch failed"); err.kind = "fetch"; throw err;
  }
  const blob = JSON.parse(blobText);
  let plain;
  try{
    plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(blob.iv)}, key, b64ToBytes(blob.data));
  }catch(e){
    const err = new Error("decrypt failed"); err.kind = "decrypt"; throw err;
  }
  return JSON.parse(new TextDecoder().decode(plain));
}
function card(title, inner, cls){
  return `<div class="card ${cls||""}"><h2>${esc(title)}</h2>${inner}</div>`;
}
function rows(items){
  return items.map(it=>`<div class="row"><span class="t">${esc(it.title)}</span><span class="s">${esc(it.sub||"")}</span></div>`).join("");
}
function render(d){
  // daily palette rotation
  const now = new Date();
  const doy = Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
  const p = PALETTES[doy % PALETTES.length];
  const r = document.documentElement.style;
  r.setProperty("--bg",p.bg); r.setProperty("--card",p.card); r.setProperty("--ink",p.ink);
  r.setProperty("--muted",p.muted); r.setProperty("--accent",p.accent); r.setProperty("--accent2",p.accent2);

  $("#titleDay").textContent = d.today && d.today.label ? d.today.label : "Today";
  let html = "";
  if(d.today && d.today.nextEvent){
    html += `<div class="card hero"><h2>Up next</h2><div class="big">${esc(d.today.nextEvent.title)}</div><div class="sub">${esc(d.today.nextEvent.sub||"")}</div></div>`;
  }
  if(d.schedule && d.schedule.length){
    html += card("Today's schedule", rows(d.schedule), "wide");
  }
  if(d.tomorrow && d.tomorrow.length){
    html += card("Tomorrow", rows(d.tomorrow));
  }
  if(d.weather && d.weather.today){
    const w = d.weather.today;
    html += card("Weather today", `<div class="big">${esc(w.high)}° / ${esc(w.low)}°</div><div class="med">${esc(w.cond||"")}</div><div class="s" style="color:var(--muted);margin-top:6px">Rain ${esc(w.rain||"—")}</div>`);
  }
  if(d.weather && d.weather.weekend){
    const w = d.weather.weekend;
    html += card("Weekend weather", `<div class="med">${esc(w.label||"Weekend")}</div><div class="big">${esc(w.high)}° / ${esc(w.low)}°</div><div style="color:var(--muted)">Rain ${esc(w.rain||"—")}</div>`);
  }
  if(d.sunset){
    html += card("Sunset", `<div class="big">${esc(d.sunset)}</div>`);
  }
  if(d.dinner){
    html += card("Tonight's dinner", `<div class="med">${esc(d.dinner)}</div>`, "lime");
  }
  if(d.meals && d.meals.length){
    html += card("This week's meals", rows(d.meals));
  }
  if(d.shopping){
    const top = (d.shopping.top||[]).map(t=>`<div class="row"><span class="t">${esc(t)}</span></div>`).join("");
    html += card("Shopping list", `<div class="big">${esc(d.shopping.count)} items</div>${top}`);
  }
  if(d.low && d.low.length){
    html += card("Running low", d.low.map(t=>`<div class="row"><span class="t">${esc(t)}</span></div>`).join(""), "accent");
  }
  if(d.deals && d.deals.length){
    html += card("Deals this week", rows(d.deals));
  }
  if(d.countdowns && d.countdowns.length){
    html += card("Counting down", d.countdowns.map(c=>`<div class="row"><span class="t">${esc(c.label)}</span><span class="s">${esc(c.days)} days</span></div>`).join(""), "purple");
  }
  if(d.health){
    let inner = "";
    if(d.health.steps) inner += `<div class="row"><span class="t">Steps</span><span class="s">${esc(d.health.steps)}</span></div>`;
    if(d.health.sleep) inner += `<div class="row"><span class="t">Sleep</span><span class="s">${esc(d.health.sleep)}</span></div>`;
    if(d.health.weight) inner += `<div class="row"><span class="t">Weight</span><span class="s">${esc(d.health.weight)}</span></div>`;
    if(inner) html += card("Health", inner);
  }
  if(d.budget){
    html += card("Budget", `<div class="big">${esc(d.budget.left)} left</div><div style="color:var(--muted)">of ${esc(d.budget.of)} this month</div>`, "lime");
  }
  if(d.plan){
    html += card("Tonight's plan", `<div class="med">${esc(d.plan)}</div>`, "purple");
  }
  $("#grid").innerHTML = html || card("Board", `<div class="med">No data yet — check back after the next refresh.</div>`);
  if(d.generatedAt){
    const g = new Date(d.generatedAt);
    $("#foot").textContent = "Updated " + g.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  }
}
function tickClock(){
  const n = new Date();
  $("#clockTime").textContent = n.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  $("#clockDate").textContent = n.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
}
async function unlock(code){
  $("#gateErr").textContent = "";
  $("#status").textContent = "Opening…";
  try{
    const d = await loadBoard(code);
    localStorage.setItem("famdash_code", code);
    $("#gate").style.display = "none";
    $("#board").style.display = "block";
    $("#lockBtn").style.display = "block";
    render(d);
    $("#status").textContent = "";
    clearInterval(window._refetch);
    window._refetch = setInterval(async ()=>{
      try{ render(await loadBoard(localStorage.getItem("famdash_code"))); }catch(e){}
    }, 60*60*1000);
  }catch(e){
    $("#gateErr").textContent = e && e.kind === "fetch"
      ? "Couldn't reach the data — check the connection and try again."
      : "That passcode didn't work. Try again.";
    $("#status").textContent = "";
    localStorage.removeItem("famdash_code");
  }
}
$("#unlockBtn").addEventListener("click", ()=>{ const c = $("#code").value.trim(); if(c) unlock(c); });
$("#code").addEventListener("keydown", e=>{ if(e.key === "Enter"){ const c = $("#code").value.trim(); if(c) unlock(c); } });
$("#lockBtn").addEventListener("click", ()=>{
  localStorage.removeItem("famdash_code");
  $("#board").style.display = "none"; $("#lockBtn").style.display = "none";
  $("#gate").style.display = "flex"; $("#code").value = ""; $("#code").focus();
});
tickClock(); setInterval(tickClock, 30000);
const saved = localStorage.getItem("famdash_code");
if(saved){ $("#code").value = saved; unlock(saved); } else { $("#code").focus(); }
</script>
</body>
</html>
